<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Ahmet — Computer Engineer & Software Developer. Mobile and web applications.">
        <title>Ahmet — Software Developer</title>

        <!-- Preconnect for Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">

        <!-- FontAwesome Icons --> 
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <!-- Stylesheet -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="container">
            <!-- Hero Section -->
            <header class="hero fade-up">
                <div class="avatar" aria-hidden="true">
                    <i class="fa-solid fa-code"></i>
                </div>
                <h1>Ahmet Sayan</h1>
                <p class="subtitle">Computer Engineer / Software Developer</p>
                <p class="bio">I build innovative, performance-focused, and
                    user-friendly mobile and web applications.</p>

                <div class="social-links">
                    <a href="https://github.com/ahmetfsyn" target="_blank"
                        rel="noopener noreferrer" class="social-link"
                        aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="mailto:ahmetfsyn@gmail.com"
                        class="social-link" aria-label="Email">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
            </header>

            <hr class="divider">

            <!-- Projects & Applications Section -->
            <section class="projects" id="projects">
                <h2 class="fade-up">My Applications</h2>
                <div class="projects-grid" id="projects-grid">
                    <noscript>
                        <article class="project-card fade-up">
                            <div class="project-top-row">
                                <div class="project-icon-wrapper">
                                    <div class="project-icon">
                                        <img src="./campuwise/images/logo.svg" alt="CampuWise logo">
                                    </div>
                                </div>
                                <div class="project-meta-badges">
                                    <span class="badge badge-featured"><i class="fa-solid fa-star"></i> Featured</span>
                                    <span class="badge badge-status status-live"><span class="status-pulse-dot"></span>Live</span>
                                    <span class="badge badge-year">2026</span>
                                </div>
                            </div>
                            <div class="project-body">
                                <h3 class="project-title">CampuWise</h3>
                                <p class="project-desc">CampuWise is your all-in-one campus assistant. It helps you stay updated with your university, announcements, ring schedules, cafeteria menus, and campus events.</p>
                            </div>
                            <div class="project-actions">
                                <a href="/campuwise/" class="btn btn-secondary"><i class="fa-solid fa-globe"></i> Website <i class="fa-solid fa-arrow-up-right-from-square btn-arrow"></i></a>
                            </div>
                        </article>
                        <article class="project-card fade-up">
                            <div class="project-top-row">
                                <div class="project-icon-wrapper">
                                    <div class="project-icon">
                                        <img src="./aura-focus/app-icon.png" alt="Aura Focus logo">
                                    </div>
                                </div>
                                <div class="project-meta-badges">
                                    <span class="badge badge-status status-live"><span class="status-pulse-dot"></span>Live</span>
                                    <span class="badge badge-year">2026</span>
                                </div>
                            </div>
                            <div class="project-body">
                                <h3 class="project-title">Aura Focus</h3>
                                <p class="project-desc">A minimalist assistant app with advanced features designed to boost your focus, time management, and daily productivity.</p>
                            </div>
                            <div class="project-actions">
                                <a href="/aura-focus/" class="btn btn-secondary"><i class="fa-solid fa-globe"></i> Website <i class="fa-solid fa-arrow-up-right-from-square btn-arrow"></i></a>
                            </div>
                        </article>
                    </noscript>
                </div>
            </section>

        </main>

        <footer class="site-footer">
            <p>&copy; 2026 ahmetfsyn.com.tr — All rights reserved.</p>
        </footer>

        <!-- Data Registry & Application Script -->
        <script src="projects.js"></script>
        <script src="script.js"></script>
    </body>
</html>
