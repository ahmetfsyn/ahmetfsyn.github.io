<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0B10" />
      <stop offset="100%" stop-color="#12131C" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <!-- Phone Background -->
  <rect width="375" height="812" fill="url(#bg)" />

  <!-- Status Bar -->
  <text x="28" y="38" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="600">09:41</text>
  <circle cx="310" cy="34" r="4" fill="#8B5CF6" />
  <rect x="322" y="28" width="22" height="12" rx="3" fill="none" stroke="#F8FAFC" stroke-width="1.5" />
  <rect x="324" y="30" width="14" height="8" rx="1.5" fill="#F8FAFC" />

  <!-- Header -->
  <g transform="translate(24, 60)">
    <text x="0" y="24" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="22" font-weight="800">Kampüs Shuttle (Ring)</text>
    <text x="0" y="44" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Canlı Otobüs Sefer Saatleri</text>
  </g>

  <!-- Active Bus Banner -->
  <g transform="translate(24, 130)">
    <rect width="327" height="100" rx="20" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="20" y="36" fill="#8B5CF6" font-family="Inter, sans-serif" font-size="11" font-weight="800">⚡ EN YAKIN SEFER</text>
    <text x="20" y="62" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="17" font-weight="800">Çiftlikköy ➔ Tarsus Kampüs</text>
    <text x="20" y="82" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Kalkış Durağı: Rektörlük Önü</text>
    
    <rect x="235" y="28" width="72" height="44" rx="12" fill="#8B5CF6" />
    <text x="271" y="48" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="800" text-anchor="middle">5 dk</text>
    <text x="271" y="62" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">14:15</text>
  </g>

  <!-- Timetable List -->
  <text x="24" y="260" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15" font-weight="700">Günün Tüm Seferleri</text>

  <!-- Item 1 -->
  <g transform="translate(24, 280)">
    <rect width="327" height="72" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="36" cy="36" r="16" fill="rgba(6,182,212,0.15)" />
    <path d="M 30 36 L 42 36 M 38 30 L 42 36 L 38 42" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
    
    <text x="68" y="34" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">14:30 Seferi</text>
    <text x="68" y="52" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Tıp Fakültesi ➔ Mühendislik</text>
    <text x="265" y="42" fill="#06B6D4" font-family="Inter, sans-serif" font-size="12" font-weight="700">Zamanında</text>
  </g>

  <!-- Item 2 -->
  <g transform="translate(24, 365)">
    <rect width="327" height="72" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="36" cy="36" r="16" fill="rgba(99,102,241,0.15)" />
    <path d="M 30 36 L 42 36 M 38 30 L 42 36 L 38 42" stroke="#6366F1" stroke-width="2" stroke-linecap="round" />
    
    <text x="68" y="34" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">14:45 Seferi</text>
    <text x="68" y="52" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Merkez Yemekhane ➔ Yurtlar</text>
    <text x="265" y="42" fill="#6366F1" font-family="Inter, sans-serif" font-size="12" font-weight="700">Planlandı</text>
  </g>

  <!-- Item 3 -->
  <g transform="translate(24, 450)">
    <rect width="327" height="72" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="36" cy="36" r="16" fill="rgba(255,255,255,0.05)" />
    <path d="M 30 36 L 42 36 M 38 30 L 42 36 L 38 42" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    
    <text x="68" y="34" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">15:00 Seferi</text>
    <text x="68" y="52" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Çiftlikköy ➔ Tarsus Kampüs</text>
    <text x="265" y="42" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Planlandı</text>
  </g>

  <!-- Bottom Nav Bar -->
  <g transform="translate(0, 722)">
    <rect width="375" height="90" fill="#0A0B10" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <g transform="translate(40, 16)">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Akış</text>
    </g>

    <g transform="translate(125, 16)">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Harita</text>
    </g>

    <g transform="translate(210, 16)">
      <circle cx="16" cy="16" r="16" fill="rgba(139,92,246,0.2)" />
      <path d="M 10 12 L 22 12 M 10 17 L 22 17 M 10 22 L 18 22" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />
      <text x="16" y="44" fill="#8B5CF6" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Yemek &amp; Ring</text>
    </g>

    <g transform="translate(300, 16)">
      <rect x="10" y="10" width="12" height="14" rx="2" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Takvim</text>
    </g>
  </g>
</svg>
