<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0B10" />
      <stop offset="100%" stop-color="#12131C" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <!-- Phone Background -->
  <rect width="375" height="812" fill="url(#bg)" />

  <!-- Status Bar -->
  <text x="28" y="38" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="600">09:41</text>
  <circle cx="310" cy="34" r="4" fill="#6366F1" />
  <rect x="322" y="28" width="22" height="12" rx="3" fill="none" stroke="#F8FAFC" stroke-width="1.5" />
  <rect x="324" y="30" width="14" height="8" rx="1.5" fill="#F8FAFC" />

  <!-- App Header -->
  <g transform="translate(24, 60)">
    <text x="0" y="24" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="22" font-weight="800">Duyuru Akışı</text>
    <text x="0" y="44" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Mersin &amp; Tarsus Üniversiteleri</text>
    <!-- Bell Icon -->
    <rect x="280" y="4" width="40" height="40" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <path d="M 298 18 C 298 15 304 15 304 18 C 304 25 307 27 307 27 L 293 27 C 293 27 296 25 296 18 Z" fill="#6366F1" />
    <circle cx="304" cy="14" r="3" fill="#06B6D4" />
  </g>

  <!-- Category Filter Pills -->
  <g transform="translate(24, 130)">
    <rect x="0" y="0" width="70" height="32" rx="16" fill="#6366F1" />
    <text x="35" y="20" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tümü</text>

    <rect x="78" y="0" width="75" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="115" y="20" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">ÖSYM</text>

    <rect x="161" y="0" width="85" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="203" y="20" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">TÜBİTAK</text>

    <rect x="254" y="0" width="75" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="291" y="20" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">GSB</text>
  </g>

  <!-- Feed Cards -->
  <!-- Card 1 -->
  <g transform="translate(24, 180)">
    <rect width="327" height="155" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect x="16" y="16" width="55" height="22" rx="6" fill="rgba(139,92,246,0.2)" />
    <text x="43" y="31" fill="#8B5CF6" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ÖSYM</text>
    <text x="240" y="31" fill="#64748B" font-family="Inter, sans-serif" font-size="11">10 dakika önce</text>

    <text x="16" y="65" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15" font-weight="700">2026 DGS Başvuru Kılavuzu Yayınlandı</text>
    <text x="16" y="90" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Dikey Geçiş Sınavı başvuruları ÖSYM AİS sistemi üzerinden alınmaya başlamıştır.</text>
    
    <text x="16" y="132" fill="#06B6D4" font-family="Inter, sans-serif" font-size="11" font-weight="600">Detayları İncele →</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(24, 350)">
    <rect width="327" height="155" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect x="16" y="16" width="75" height="22" rx="6" fill="rgba(6,182,212,0.2)" />
    <text x="53" y="31" fill="#06B6D4" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">REKTÖRLÜK</text>
    <text x="250" y="31" fill="#64748B" font-family="Inter, sans-serif" font-size="11">1 saat önce</text>

    <text x="16" y="65" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15" font-weight="700">Bahar Şenliği &amp; Konser Takvimi</text>
    <text x="16" y="90" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Çiftlikköy ana kampüsünde gerçekleşecek festival programı ve kulüp stantları açıklanmıştır.</text>
    
    <text x="16" y="132" fill="#06B6D4" font-family="Inter, sans-serif" font-size="11" font-weight="600">Etkinlik Programı →</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(24, 520)">
    <rect width="327" height="155" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect x="16" y="16" width="65" height="22" rx="6" fill="rgba(99,102,241,0.2)" />
    <text x="48" y="31" fill="#6366F1" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">TÜBİTAK</text>
    <text x="260" y="31" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Dün</text>

    <text x="16" y="65" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15" font-weight="700">2209-A Öğrenci Projeleri Çağrısı</text>
    <text x="16" y="90" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Üniversite öğrencileri araştırma projeleri destekleme programı başvuruları uzatıldı.</text>
    
    <text x="16" y="132" fill="#06B6D4" font-family="Inter, sans-serif" font-size="11" font-weight="600">Başvuru Koşulları →</text>
  </g>

  <!-- Bottom Nav Bar -->
  <g transform="translate(0, 722)">
    <rect width="375" height="90" fill="#0A0B10" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <g transform="translate(40, 16)">
      <circle cx="16" cy="16" r="16" fill="rgba(99,102,241,0.2)" />
      <path d="M 10 16 L 16 10 L 22 16 L 22 23 L 10 23 Z" fill="#6366F1" />
      <text x="16" y="44" fill="#6366F1" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Akış</text>
    </g>

    <g transform="translate(125, 16)">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Harita</text>
    </g>

    <g transform="translate(210, 16)">
      <path d="M 10 12 L 22 12 M 10 17 L 22 17 M 10 22 L 18 22" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Yemek &amp; Ring</text>
    </g>

    <g transform="translate(300, 16)">
      <rect x="10" y="10" width="12" height="14" rx="2" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Takvim</text>
    </g>
  </g>
</svg>
