<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0B10" />
      <stop offset="100%" stop-color="#12131C" />
    </linearGradient>
    <pattern id="mapPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="20" cy="20" r="1.5" fill="rgba(99, 102, 241, 0.15)" />
    </pattern>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(18, 19, 28, 0.95)" />
      <stop offset="100%" stop-color="rgba(10, 11, 16, 0.95)" />
    </linearGradient>
  </defs>

  <!-- Phone Background -->
  <rect width="375" height="812" fill="url(#bg)" />

  <!-- Map Grid Simulation -->
  <rect width="375" height="812" fill="url(#mapPattern)" />

  <!-- Simulated Roads & Paths -->
  <path d="M -20 200 Q 150 180 200 350 T 400 600" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="24" stroke-linecap="round" />
  <path d="M -20 200 Q 150 180 200 350 T 400 600" fill="none" stroke="rgba(99,102,241,0.2)" stroke-width="8" stroke-dasharray="10,6" />
  <path d="M 50 800 L 200 350 L 380 250" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="16" />

  <!-- Building Markers -->
  <rect x="80" y="220" width="70" height="50" rx="10" fill="rgba(6,182,212,0.15)" stroke="#06B6D4" stroke-width="1.5" />
  <text x="115" y="250" fill="#06B6D4" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Mühendislik</text>

  <rect x="220" y="160" width="80" height="60" rx="10" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="1.5" />
  <text x="260" y="195" fill="#8B5CF6" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Kütüphane</text>

  <!-- Map Pins -->
  <g transform="translate(195, 330)">
    <circle cx="0" cy="0" r="24" fill="rgba(99,102,241,0.3)" />
    <circle cx="0" cy="0" r="12" fill="#6366F1" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <g transform="translate(255, 150)">
    <path d="M 0 0 C -8 -16 -12 -24 -12 -30 C -12 -38 -5 -44 0 -44 C 5 -44 12 -38 12 -30 C 12 -24 8 -16 0 0 Z" fill="#8B5CF6" />
    <circle cx="0" cy="-30" r="4" fill="#FFFFFF" />
  </g>

  <!-- Status Bar -->
  <text x="28" y="38" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="600">09:41</text>
  <circle cx="310" cy="34" r="4" fill="#06B6D4" />
  <rect x="322" y="28" width="22" height="12" rx="3" fill="none" stroke="#F8FAFC" stroke-width="1.5" />
  <rect x="324" y="30" width="14" height="8" rx="1.5" fill="#F8FAFC" />

  <!-- Search Overlay -->
  <g transform="translate(24, 60)">
    <rect width="327" height="48" rx="16" fill="rgba(18,19,28,0.9)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="28" cy="24" r="6" fill="none" stroke="#94A3B8" stroke-width="2" />
    <line x1="32" y1="28" x2="38" y2="34" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <text x="50" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Kampüs içi derslik, amfi veya cafe ara...</text>
  </g>

  <!-- Venue Detail Bottom Drawer -->
  <g transform="translate(24, 520)">
    <rect width="327" height="180" rx="24" fill="url(#cardGrad)" stroke="rgba(99,102,241,0.3)" stroke-width="1.5" />
    <rect x="145" y="10" width="37" height="4" rx="2" fill="rgba(255,255,255,0.2)" />

    <text x="20" y="44" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="800">Çiftlikköy Merkezi Kütüphane</text>
    <text x="20" y="66" fill="#06B6D4" font-family="Inter, sans-serif" font-size="12" font-weight="600">📍 Çalışma Alanı • 3. Kat Amfi</text>

    <!-- Occupancy Bar -->
    <text x="20" y="96" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Doluluk Oranı (%78)</text>
    <rect x="20" y="106" width="287" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="106" width="224" height="8" rx="4" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1" />

    <rect x="20" y="130" width="135" height="36" rx="12" fill="#6366F1" />
    <text x="87" y="153" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Yol Tarifi Al</text>

    <rect x="165" y="130" width="142" height="36" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="236" y="153" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Etkinlikler (3)</text>
  </g>

  <!-- Bottom Nav Bar -->
  <g transform="translate(0, 722)">
    <rect width="375" height="90" fill="#0A0B10" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <g transform="translate(40, 16)">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Akış</text>
    </g>

    <g transform="translate(125, 16)">
      <circle cx="16" cy="16" r="16" fill="rgba(6,182,212,0.2)" />
      <circle cx="16" cy="16" r="6" fill="#06B6D4" />
      <text x="16" y="44" fill="#06B6D4" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Harita</text>
    </g>

    <g transform="translate(210, 16)">
      <path d="M 10 12 L 22 12 M 10 17 L 22 17 M 10 22 L 18 22" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Yemek &amp; Ring</text>
    </g>

    <g transform="translate(300, 16)">
      <rect x="10" y="10" width="12" height="14" rx="2" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Takvim</text>
    </g>
  </g>
</svg>
