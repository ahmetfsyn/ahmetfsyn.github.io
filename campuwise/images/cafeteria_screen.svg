<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0B10" />
      <stop offset="100%" stop-color="#12131C" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <!-- Phone Background -->
  <rect width="375" height="812" fill="url(#bg)" />

  <!-- Status Bar -->
  <text x="28" y="38" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="600">09:41</text>
  <circle cx="310" cy="34" r="4" fill="#F59E0B" />
  <rect x="322" y="28" width="22" height="12" rx="3" fill="none" stroke="#F8FAFC" stroke-width="1.5" />
  <rect x="324" y="30" width="14" height="8" rx="1.5" fill="#F8FAFC" />

  <!-- Header -->
  <g transform="translate(24, 60)">
    <text x="0" y="24" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="22" font-weight="800">Yemekhane Menüsü</text>
    <text x="0" y="44" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Günlük &amp; Haftalık Öğrenci Tabldot</text>
  </g>

  <!-- Date selector -->
  <g transform="translate(24, 130)">
    <rect width="327" height="44" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" />
    <rect x="4" y="4" width="100" height="36" rx="10" fill="#F59E0B" />
    <text x="54" y="26" fill="#0A0B10" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Bugün</text>
    
    <text x="163" y="26" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Yarın</text>
    <text x="270" y="26" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Haftalık</text>
  </g>

  <!-- Today's Meal Card -->
  <g transform="translate(24, 195)">
    <rect width="327" height="320" rx="24" fill="url(#cardGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" />
    
    <!-- Top badge -->
    <rect x="20" y="20" width="120" height="26" rx="8" fill="rgba(245,158,11,0.2)" />
    <text x="80" y="37" fill="#F59E0B" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ÖĞLE YEMEĞİ</text>
    <text x="235" y="37" fill="#10B981" font-family="Inter, sans-serif" font-size="14" font-weight="800">20.00 ₺</text>

    <!-- Dish List -->
    <g transform="translate(20, 70)">
      <circle cx="12" cy="12" r="12" fill="rgba(255,255,255,0.1)" />
      <text x="12" y="16" fill="#F59E0B" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <text x="36" y="16" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Süzme Mercimek Çorbası</text>
    </g>

    <g transform="translate(20, 115)">
      <circle cx="12" cy="12" r="12" fill="rgba(255,255,255,0.1)" />
      <text x="12" y="16" fill="#F59E0B" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <text x="36" y="16" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Geleneksel Orman Kebabı</text>
    </g>

    <g transform="translate(20, 160)">
      <circle cx="12" cy="12" r="12" fill="rgba(255,255,255,0.1)" />
      <text x="12" y="16" fill="#F59E0B" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <text x="36" y="16" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Tereyağlı Şehriyeli Pilav</text>
    </g>

    <g transform="translate(20, 205)">
      <circle cx="12" cy="12" r="12" fill="rgba(255,255,255,0.1)" />
      <text x="12" y="16" fill="#F59E0B" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4</text>
      <text x="36" y="16" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Mevsim Meyvesi / Ayran</text>
    </g>

    <line x1="20" y1="245" x2="307" y2="245" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Nutrition Summary -->
    <text x="20" y="275" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Toplam Besin Değeri:</text>
    <text x="220" y="275" fill="#F59E0B" font-family="Inter, sans-serif" font-size="13" font-weight="700">🔥 785 kcal</text>
  </g>

  <!-- Bottom Nav Bar -->
  <g transform="translate(0, 722)">
    <rect width="375" height="90" fill="#0A0B10" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <g transform="translate(40, 16)">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Akış</text>
    </g>

    <g transform="translate(125, 16)">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Harita</text>
    </g>

    <g transform="translate(210, 16)">
      <circle cx="16" cy="16" r="16" fill="rgba(245,158,11,0.2)" />
      <path d="M 10 12 L 22 12 M 10 17 L 22 17 M 10 22 L 18 22" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
      <text x="16" y="44" fill="#F59E0B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Yemek &amp; Ring</text>
    </g>

    <g transform="translate(300, 16)">
      <rect x="10" y="10" width="12" height="14" rx="2" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="16" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Takvim</text>
    </g>
  </g>
</svg>
